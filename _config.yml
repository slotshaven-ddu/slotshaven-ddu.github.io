title: Digitalt Design og Udvikling
description: Slotshaven Gymnasium
theme: jekyll-theme-cayman
plugins:
  - jekyll-redirect-from
  
collections:
  test:
    output: true
  minikurser:
    output: true
    permalink: /minikurser/:name/
  forloeb:
    output: true
    permalink: /forloeb/:name/
defaults:
  - scope:
      path: "sider"
    values:
      permalink: /:slug/ # Default permalink for pages in the sider directory
  - scope:
      path: "temasider"
    values:
      permalink: /:slug/ # Default permalink for pages in the temasider directory
  - scope:
      path: ""
      type: forloeb  # Name of the collection
    values:
      published: true
      layout: default
  